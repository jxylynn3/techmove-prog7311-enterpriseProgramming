# ═══════════════════════════════════════════════════════════════════════════════
# GLMS Docker Compose — ST10448420 TechMove
#
# FILE LOCATION: ST10448420_TechMove_GLMS\docker-compose.yml
#   (inside the MVC project folder, next to the .slnx solution file)
#
# HOW PATHS WORK FROM THIS FILE'S LOCATION:
#   "."  = ST10448420_TechMove_GLMS\      (MVC — current folder)
#   "../ST10448420_TecMove_GLMS_API" = sibling folder one level up in repos\
#
# HOW CONTAINERS TALK TO EACH OTHER:
#   MVC  → API via: http://glms-backend-api:8080  (Docker DNS — no localhost)
#   API  → SQL via: Server=sql-server-db,1433      (Docker DNS — no localhost)
#   Your browser:
#     MVC  → http://localhost:8081
#     API  → http://localhost:8080
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # CONTAINER 1: sql-server-db
  # Microsoft SQL Server 2022 on Linux.
  # Both databases (MVC Identity + API data) live inside this one SQL Server.
  # ─────────────────────────────────────────────────────────────────────────────
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "GlmsD0cker!Pass"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - glms-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'GlmsD0cker!Pass' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # CONTAINER 2: glms-backend-api
  # The ASP.NET 10 Web API project.
  # context path: go UP one level from MVC folder to repos\, then into API folder
  # ─────────────────────────────────────────────────────────────────────────────
  glms-backend-api:
    container_name: glms-backend-api
    build:
      context: ../ST10448420_TecMove_GLMS_API
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=ST10448420_TechMove_GLMS_API_DB;User Id=SA;Password=GlmsD0cker!Pass;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "GlmsD0ckerJwtSecretKeyThatIs32Chars!!"
      Jwt__Issuer: "ST10448420_GLMS_API"
      Jwt__Audience: "ST10448420_GLMS_Client"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-network

  # ─────────────────────────────────────────────────────────────────────────────
  # CONTAINER 3: glms-frontend-web
  # The ASP.NET 10 MVC web application.
  # context: "." = this folder (ST10448420_TechMove_GLMS\) where compose file lives
  # ─────────────────────────────────────────────────────────────────────────────
  glms-frontend-web:
    container_name: glms-frontend-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Docker"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=ST10448420_TechMove_GLMS_DB;User Id=SA;Password=GlmsD0cker!Pass;TrustServerCertificate=True;MultipleActiveResultSets=true"
      ApiSettings__BaseUrl: "http://glms-backend-api:8080/"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:

networks:
  glms-network:
    driver: bridge